version: '3.9'

services:

  # ── Database ──────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: vigil-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vigil_db}
    ports:
      - "5432:5432"
    volumes:
      - vigil_db_data:/var/lib/postgresql/data
      - ../backend/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ../backend/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigil}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigil-net

  # ── Backend ───────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: vigil-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vigil}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vigil_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend/app:/app/app
      - ../ml/models:/app/ml_models
    networks:
      - vigil-net

  # ── Frontend ──────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: vigil-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - vigil-net

  # ── Sensor Simulator ──────────────────────
  simulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.simulator
    container_name: vigil-simulator
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      INTERVAL_SECONDS: 30
    depends_on:
      - backend
    networks:
      - vigil-net

networks:
  vigil-net:
    driver: bridge

volumes:
  vigil_db_data:
